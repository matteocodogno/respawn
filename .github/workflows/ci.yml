name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: build the showcase
        run: go run ./cmd/respawn build --dir examples/showcase --out dist/showcase
      - name: cross-compile
        run: |
          for t in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/respawn
          done
