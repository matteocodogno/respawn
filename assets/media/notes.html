<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker notes</title>
<!--
  Presenter view, opened with "s" from the deck. It follows the presentation window
  through the demoit_nav BroadcastChannel (same browser only) and shows:
  the current slide, the previous and the next one, the speaker notes, a clock, and
  with "a" (or the button) every slide of the deck, to jump anywhere.
  Slide pictures are the real slides in thumbnail mode (/N?thumb=1), scaled down.
-->
<style>
  @font-face { font-family: 'Ubuntu'; font-weight: 400; src: url('/fonts/ubuntu-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Ubuntu'; font-weight: 500; src: url('/fonts/ubuntu-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Noto Serif'; font-weight: 400; src: url('/fonts/noto-serif-latin-400-normal.woff2') format('woff2'); }
  :root { --bg: #141218; --surface: #23242A; --text: #F8F9FA; --muted: #A6A7AB; --primary: #E50339; --outline: #464957; --ok: #7CFC5A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: 'Noto Serif', serif; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  header, footer { display: flex; gap: 16px; align-items: center; padding: 12px 20px; font-family: 'Ubuntu', sans-serif; }
  header { border-bottom: 1px solid var(--outline); }
  footer { border-top: 1px solid var(--outline); }
  #progress { background: var(--primary); padding: 4px 12px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  #title { font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  #clock { color: var(--muted); font-variant-numeric: tabular-nums; cursor: pointer; font-size: 20px; }
  button { font: 500 15px 'Ubuntu', sans-serif; background: var(--surface); color: var(--text); border: 1px solid var(--outline); border-radius: 8px; padding: 8px 18px; cursor: pointer; white-space: nowrap; }
  button:hover, button:focus-visible { border-color: var(--primary); outline: none; }
  .hint { margin-left: auto; color: var(--muted); font: 14px 'Ubuntu', sans-serif; }

  /* presenter view: slides on the left, notes on the right */
  main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; padding: 20px; min-height: 0; }
  .slides { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: auto; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .label { font: 500 12px 'Ubuntu', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .now .label { color: var(--text); }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: #0b0a0e; border: 1px solid var(--outline); border-radius: 6px; overflow: hidden; }
  .now .thumb { border: 2px solid var(--primary); }
  .pair .thumb { cursor: pointer; }
  .pair .thumb:hover { border-color: var(--primary); }
  .thumb iframe { position: absolute; top: 0; left: 0; width: 1600px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .thumb .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 14px 'Ubuntu', sans-serif; }
  #notes { overflow: auto; font-size: 22px; line-height: 1.5; padding: 4px 8px 4px 0; min-height: 0; }
  #notes p { margin: 0 0 16px; }
  #notes .empty { color: var(--muted); font-style: italic; }

  /* every slide */
  #all { position: fixed; inset: 0; background: var(--bg); display: grid; grid-template-rows: auto 1fr; z-index: 10; }
  #all[hidden] { display: none; }
  #all header { border-bottom: 1px solid var(--outline); }
  #all h2 { margin: 0; font: 500 20px 'Ubuntu', sans-serif; }
  #filter { flex: 1; max-width: 420px; font: 16px 'Ubuntu', sans-serif; padding: 8px 12px; background: var(--surface); color: var(--text); border: 1px solid var(--outline); border-radius: 8px; outline: none; }
  #filter:focus { border-color: var(--primary); }
  #grid { overflow: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; align-content: start; }
  .card { cursor: pointer; border-radius: 8px; padding: 6px; border: 2px solid transparent; }
  .card:hover, .card.sel { border-color: var(--outline); }
  .card.cur { border-color: var(--primary); }
  .card .meta { display: flex; gap: 8px; align-items: baseline; margin-top: 6px; font: 13px 'Ubuntu', sans-serif; color: var(--muted); }
  .card .meta b { color: var(--text); font-weight: 500; }
  .card .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card[hidden] { display: none; }

  @media (max-width: 900px) {
    body { overflow: auto; }
    main { grid-template-columns: 1fr; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <span id="progress">–</span>
  <span id="title">Waiting for the presentation window…</span>
  <button id="open-all" type="button" title="Every slide (a)">▦ All slides</button>
  <span id="clock" title="Click to reset">00:00</span>
</header>
<main>
  <section class="slides">
    <div class="now"><div class="label"><span>Now</span><span id="now-n"></span></div><div class="thumb" id="t-now"></div></div>
    <div class="pair">
      <div><div class="label"><span>Previous</span><span id="prev-n"></span></div><div class="thumb" id="t-prev" title="Go back"></div></div>
      <div><div class="label"><span>Next</span><span id="next-n"></span></div><div class="thumb" id="t-next" title="Go to the next slide"></div></div>
    </div>
  </section>
  <section id="notes"><p class="empty">Open the presentation in another window. Notes follow the current slide.</p></section>
</main>
<footer>
  <button id="prev" type="button">◀ Previous</button>
  <button id="next" type="button">Next ▶</button>
  <span class="hint">← → move the presentation · a every slide · Esc close</span>
</footer>

<div id="all" hidden>
  <header>
    <h2>All slides</h2>
    <input id="filter" type="search" placeholder="Filter by title or text…" autocomplete="off" spellcheck="false">
    <span class="hint">Click a slide to go there · Esc to close</span>
    <button id="close-all" type="button">Close</button>
  </header>
  <div id="grid"></div>
</div>

<script>
  const channel = new BroadcastChannel('demoit_nav');
  let current = -1, count = 0;
  const $ = (id) => document.getElementById(id);

  // ---- slide pictures: the real slide in thumbnail mode, scaled to the box
  const sizer = new ResizeObserver((entries) => {
    for (const e of entries) {
      const f = e.target.querySelector('iframe');
      if (f) f.style.transform = `scale(${e.contentRect.width / 1600})`;
    }
  });
  const frame = (box, n) => {
    if (box.dataset.n === String(n)) return;
    box.dataset.n = String(n);
    box.innerHTML = '';
    if (n < 0 || n > count) { box.innerHTML = `<div class="none">${n < 0 ? 'Start of the deck' : 'End of the deck'}</div>`; return; }
    const f = document.createElement('iframe');
    f.tabIndex = -1;
    f.setAttribute('aria-hidden', 'true');
    f.src = `/${n}?thumb=1`;
    f.style.transform = `scale(${box.clientWidth / 1600})`;
    box.appendChild(f);
    sizer.observe(box);
  };

  // ---- following the presentation window
  channel.onmessage = (e) => {
    if (!e.data || !Object.prototype.hasOwnProperty.call(e.data, 'currentSlideId')) return;
    const moved = e.data.currentSlideId !== current;
    current = e.data.currentSlideId;
    count = e.data.stepCount;
    $('progress').textContent = current + ' / ' + count;
    const tmp = document.createElement('div');
    tmp.innerHTML = e.data.currentSlideTitle || '';
    $('title').textContent = tmp.textContent.trim() || '(untitled)';
    const notes = (e.data.speakerNotes || '').trim();
    $('notes').innerHTML = notes || '<p class="empty">No notes for this slide.</p>';
    if (moved) {
      frame($('t-now'), current);
      frame($('t-prev'), current - 1);
      frame($('t-next'), current + 1);
      $('now-n').textContent = current;
      $('prev-n').textContent = current > 0 ? current - 1 : '';
      $('next-n').textContent = current < count ? current + 1 : '';
      if (!$('all').hidden) markCurrent();
    }
  };
  channel.postMessage('ask');
  const go = (id) => { if (id >= 0 && id <= count) channel.postMessage({ destinationSlideId: id }); };
  $('prev').onclick = () => go(current - 1);
  $('next').onclick = () => go(current + 1);
  $('t-prev').onclick = () => go(current - 1);
  $('t-next').onclick = () => go(current + 1);

  // ---- every slide: a grid that loads only what is on screen, a few at a time
  let built = false, rows = [];
  const grid = $('grid');
  const pending = [];
  let loading = 0;
  const pump = () => {
    while (loading < 4 && pending.length) {
      const box = pending.shift();
      if (!box.isConnected || box.dataset.want !== '1' || box.querySelector('iframe')) continue;
      loading += 1;
      const f = document.createElement('iframe');
      f.tabIndex = -1;
      f.setAttribute('aria-hidden', 'true');
      f.addEventListener('load', () => { if (!f.dataset.loaded) { f.dataset.loaded = '1'; loading -= 1; pump(); } }, { once: true });
      f.src = `/${box.dataset.n}?thumb=1`;
      f.style.transform = `scale(${box.clientWidth / 1600})`;
      box.appendChild(f);
      sizer.observe(box);
    }
  };
  const seen = new IntersectionObserver((entries) => {
    for (const e of entries) {
      const box = e.target;
      if (e.isIntersecting) { box.dataset.want = '1'; pending.push(box); }
      else {
        // Off screen: drop the page, so a 300-slide deck never holds 300 pages in memory.
        box.dataset.want = '';
        const f = box.querySelector('iframe');
        if (f) { if (!f.dataset.loaded) { f.dataset.loaded = '1'; loading -= 1; } f.remove(); }
      }
    }
    pump();
  }, { root: grid, rootMargin: '400px 0px' });

  const deckName = () => fetch('/0?thumb=1', { cache: 'no-store' }).then((r) => r.text())
    .then((t) => (t.match(/data-track="([\w-]+)"/) || [])[1] || 'deck').catch(() => 'deck');
  const build = async () => {
    built = true;
    const deck = await deckName();
    try { rows = await fetch(`/media/search-${deck}.json`, { cache: 'no-store' }).then((r) => r.json()); } catch { rows = []; }
    const byN = new Map(rows.map((r) => [r.n, r]));
    const frag = document.createDocumentFragment();
    for (let n = 0; n <= count; n++) {
      const r = byN.get(n) || {};
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.n = n;
      card.dataset.text = `${n} ${r.k || ''} ${r.t || ''} ${r.x || ''}`.toLowerCase();
      const name = (r.t || r.k || '').replace(/</g, '&lt;');
      card.innerHTML = `<div class="thumb" data-n="${n}"></div><div class="meta"><b>${n}</b><span>${name}</span></div>`;
      card.onclick = () => { go(n); closeAll(); };
      frag.appendChild(card);
    }
    grid.appendChild(frag);
    grid.querySelectorAll('.thumb').forEach((b) => seen.observe(b));
  };
  const markCurrent = () => {
    grid.querySelectorAll('.card.cur').forEach((c) => c.classList.remove('cur'));
    const c = grid.querySelector(`.card[data-n="${current}"]`);
    if (c) { c.classList.add('cur'); c.scrollIntoView({ block: 'center' }); }
  };
  const openAll = async () => {
    if (count <= 0) return;
    $('all').hidden = false;
    if (!built) await build();
    $('filter').value = '';
    applyFilter();
    markCurrent();
    $('filter').focus();
  };
  const closeAll = () => { $('all').hidden = true; $('filter').blur(); };
  const applyFilter = () => {
    const words = $('filter').value.toLowerCase().split(/\s+/).filter(Boolean);
    grid.querySelectorAll('.card').forEach((c) => { c.hidden = !words.every((w) => c.dataset.text.includes(w)); });
  };
  $('filter').addEventListener('input', applyFilter);
  $('filter').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const first = grid.querySelector('.card:not([hidden])');
      if (first) { go(Number(first.dataset.n)); closeAll(); }
    }
  });
  $('open-all').onclick = openAll;
  $('close-all').onclick = closeAll;

  document.addEventListener('keydown', (e) => {
    const typing = e.target && e.target.tagName === 'INPUT';
    if (e.key === 'Escape') { if (!$('all').hidden) closeAll(); return; }
    if (typing) return;
    if (!$('all').hidden) return;
    if (e.key === 'a' || e.key === 'A') { e.preventDefault(); openAll(); return; }
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(current + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(current - 1); }
  });

  let start = Date.now();
  $('clock').onclick = () => { start = Date.now(); };
  setInterval(() => {
    const s = Math.floor((Date.now() - start) / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    $('clock').textContent = (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }, 1000);
</script>
</body>
</html>
